[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boxoban-rtg"
version = "0.1.0"
description = "Return-conditioned LLM fine-tuning and evaluation on DeepMind Boxoban"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]
data = ["pandas>=2", "pyarrow>=15"]
# Training/inference pins are added and tested in the training phase.

[project.scripts]
boxoban-rtg = "boxoban_rtg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["reference: differential tests against the gym-sokoban 0.0.6 package", "levels: needs the official boxoban-levels files"]
